<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Manager status</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Martian+Mono:wdth,wght@87.5,300..500&display=swap" />
<style>
/* Signal (the owner's pick, 2026-11-03): one dark look, by choice, so there are no light tokens.
   Layout: a header line, then the board as an inbox (rows on the left, the chosen one on the right). */
:root {
  color-scheme: dark;
  --paper: #0e0f12;      /* page */
  --sheet: #0e0f12;      /* cards (flush with the page: nothing is boxed) */
  --ink: #e9e7e2;        /* text */
  --ink-soft: #8a8b91;   /* secondary text */
  --rule: #23252b;       /* hairlines */
  --wash: #181a1f;       /* code, the selected row */
  --accent: #7cb7ff;     /* links */
  --accent-wash: #16263b;
  --move: #ffb547;       /* "your move" */
  --move-wash: transparent;
  --move-rule: #3a2f1c;
  --good: #6fd39b;
  --good-wash: #14291f;
  --warn: #ffcf6b;
  --warn-wash: #2c2412;
  --bad: #ff7a7a;
  --bad-wash: #331a1c;
  --bad-solid: #c8373b;  /* filled destructive buttons, white text */
  --merge: #2f9e5f;
  --on-solid: #ffffff;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);

  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Bricolage Grotesque", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.0625rem;
  --step-2: 1.375rem;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--step-0)/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 28px; }

/* status strip */
.strip {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--rule);
  padding-block: 14px 12px; display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline;
}
.strip h1 {
  margin: 0; font: 760 var(--step-2)/1.1 var(--font-display); font-stretch: 82%;
  letter-spacing: 0.01em; text-wrap: balance;
}
.strip .when { color: var(--ink-soft); font-size: var(--step--1); font-variant-numeric: tabular-nums; }
.strip .need { margin-left: auto; font-size: var(--step--1); color: var(--ink-soft); }
.strip .need strong { font: 760 var(--step-1) var(--font-display); color: var(--move); }
.stale {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
  background: var(--bad-solid); color: var(--on-solid); font: 700 11px/1.6 var(--font-body);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.notice { padding: 12px 14px; border: 1px dashed var(--rule); border-radius: 8px; color: var(--ink-soft); }
.notice strong { color: var(--ink); }

/* sections */
section { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
section > h2 {
  margin: 0; font: 700 var(--step--1)/1.2 var(--font-display); font-stretch: 100%;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft);
}
section > h2 .count { font-weight: 500; letter-spacing: 0.04em; }
.empty { margin: 0; color: var(--ink-soft); }

/* row cards */
.cards { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.card {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
  display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
.card.mine { border-color: var(--move-rule); }
.move {
  background: var(--move-wash); color: var(--move); border-bottom: 1px solid var(--move-rule);
  padding: 8px 16px; font: 700 var(--step-1)/1.3 var(--font-display); font-stretch: 92%;
}
.body > div:empty { display: none; }
.body { padding: 12px 16px 14px; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.head h3 { margin: 0; flex: 1 1 22rem; font: 650 var(--step-1)/1.35 var(--font-body); text-wrap: balance; }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: var(--step--1); }
.refs .box { color: var(--ink-soft); }
.doing { color: var(--ink); }
.doing .why { color: var(--ink-soft); }
.recorded { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: var(--step--1); }
.pill {
  display: inline-block; border-radius: 4px; padding: 0 6px; font: 700 10.5px/1.7 var(--font-body);
  letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 1px;
}
.pill.pending { background: var(--warn-wash); color: var(--warn); }
.pill.done { background: var(--good-wash); color: var(--good); }
.pill.refused { background: var(--bad-wash); color: var(--bad); }
.recorded .meta { color: var(--ink-soft); }
.recorded .note { color: var(--good); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, .btn {
  font: 500 var(--step--1)/1.4 var(--font-body); color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; padding: 4px 11px; cursor: pointer;
  text-decoration: none; display: inline-block;
}
button:hover, .btn:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
button.danger { background: var(--bad-solid); border-color: var(--bad-solid); color: var(--on-solid); font-weight: 650; }
button:disabled { opacity: 0.6; cursor: default; }
.btn.merge.big {
  background: var(--merge); border-color: var(--merge); color: var(--on-solid); font-weight: 650; padding: 5px 15px;
}
.flash { color: var(--good); font-size: var(--step--1); }
form.act {
  display: grid; gap: 10px; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper);
}
form.act .choices { display: flex; flex-wrap: wrap; gap: 6px 18px; }
form.act input[type="text"], form.act textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px;
}
form.act .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 9px 11px;
  border-radius: 6px; background: var(--warn-wash); border: 1px solid var(--move-rule);
}
.confirm span { flex: 1 1 16rem; }
.error { color: var(--bad); margin: 0; }

dialog {
  max-width: min(32rem, calc(100vw - 32px)); border: 1px solid var(--rule); border-radius: 10px;
  padding: 0; background: var(--sheet); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 14, 20, 0.5); }
dialog .top { height: 5px; background: var(--bad-solid); }
dialog .in { padding: 18px 22px 20px; display: grid; gap: 10px; }
dialog h2 { margin: 0; font: 700 var(--step-2)/1.25 var(--font-display); font-stretch: 88%; text-wrap: balance; }
dialog p { margin: 0; }
dialog .small { font-size: var(--step--1); color: var(--ink-soft); }
dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

/* details */
.details { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.panel {
  border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--paper);
  display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr);
}
.panel h4 { margin: 0; font: 650 var(--step-0)/1.35 var(--font-body); }
.panel h5 { margin: 6px 0 0; font: 700 var(--step--1)/1.3 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; color: var(--ink-soft); font-size: var(--step--1); }
.state { border-radius: 999px; padding: 0 8px; font-weight: 650; font-size: 12px; }
.state.open { color: var(--good); background: var(--good-wash); }
.state.closed { color: var(--bad); background: var(--bad-wash); }
.state.merged { color: #8250df; background: rgba(130, 80, 223, 0.15); }
.state.draft { color: var(--ink-soft); background: var(--wash); }
.label { border: 1px solid var(--rule); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: var(--step--1); }
.list .ok { color: var(--good); }
.list .fail { color: var(--bad); }
.list .run { color: var(--warn); }
.list .neutral { color: var(--ink-soft); }
.files li { display: flex; gap: 10px; font-family: var(--font-mono); font-size: 12px; }
.files .n { min-width: 6.5em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.plus { color: var(--good); }
.minus { color: var(--bad); }
details.adr { border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; background: var(--sheet); min-width: 0; }
details.adr > summary { cursor: pointer; }
details.adr .sub { color: var(--ink-soft); font-size: var(--step--1); }
details.diff { margin: 8px 0; }
details.diff > summary { cursor: pointer; font-size: 12px; color: var(--ink-soft); }
pre.patch {
  margin: 0; padding: 8px 0; background: var(--wash); border-radius: 6px; overflow-x: auto;
  font: 12px/1.45 var(--font-mono); max-width: 100%;
}
pre.patch span { display: block; padding: 0 10px; white-space: pre; }
pre.patch .a { background: var(--good-wash); color: var(--good); }
pre.patch .d { background: var(--bad-wash); color: var(--bad); }
pre.patch .h { color: var(--ink-soft); }
.comment { border-top: 1px solid var(--rule); padding-top: 8px; display: grid; gap: 4px; }
.comment .who { font-size: var(--step--1); color: var(--ink-soft); }
.comment .who strong { color: var(--ink); }

/* rendered markdown */
.md { overflow-wrap: anywhere; max-width: 72ch; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2 { font-family: var(--font-display); font-stretch: 92%; border-bottom: 1px solid var(--rule); padding-bottom: 0.2em; }
.md h1 { font-size: 1.4em; } .md h2 { font-size: 1.2em; } .md h3 { font-size: 1.05em; }
.md code { font-family: var(--font-mono); font-size: 0.86em; background: var(--wash); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--wash); padding: 9px 11px; border-radius: 6px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md .tablewrap { overflow-x: auto; }
.md table { border-collapse: collapse; overflow-wrap: normal; font-size: 0.92em; }
.md th, .md td { border: 1px solid var(--rule); padding: 4px 10px; vertical-align: top; text-align: left; }
.md th { background: var(--wash); }
.md td:first-child { white-space: nowrap; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--ink-soft); }
.md hr { border: 0; border-top: 1px solid var(--rule); }
.md .img { color: var(--ink-soft); font-size: var(--step--1); }

.links { color: var(--ink-soft); font-size: var(--step--1); display: grid; gap: 2px; }
@media (max-width: 520px) {
  .strip .need { margin-left: 0; }
  .body { padding: 10px 12px 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color 160ms ease; }
}
/* live dot in the strip */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rule); margin-right: 8px; vertical-align: 1px; }
.dot.on { background: var(--good); }

/* ADR viewer */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding-block: 16px 0; color: var(--ink-soft); font-size: var(--step--1); }
.crumbs .at { margin-left: auto; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 24px; min-width: 0; }
.sheet .md { max-width: 80ch; }
.adr-files { margin: 0; padding-left: 18px; }
.md img { max-width: 100%; }
.md a.gh-link { font-size: 0.85em; color: var(--ink-soft); }
  .slots { margin: 0.75rem 0; font-size: var(--step--1); }
  .slots ul { list-style: none; margin: 0.25rem 0 0; padding: 0; }
  .slots li { padding: 0.1rem 0 0.1rem 1rem; }
  .slots code { color: var(--ink-soft); font-family: var(--font-mono); }
/* diff viewer */
.diff-head { display: grid; gap: 12px; }
.diff-head h1 { margin: 0; font: 760 var(--step-2)/1.2 var(--font-display); font-stretch: 86%; text-wrap: balance; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rule); }
.tabs button {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px 8px;
  font: 600 var(--step-0)/1.3 var(--font-body); color: var(--ink-soft); margin-bottom: -1px;
}
.tabs button:hover { color: var(--ink); border-color: var(--rule); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count {
  margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--wash); color: var(--ink-soft);
  font: 600 11.5px/1.6 var(--font-body); font-variant-numeric: tabular-nums;
}
.diff-panel { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.diff-summary { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; color: var(--ink-soft); }
.diff-summary strong { color: var(--ink); }
.toggle { margin-left: auto; font-size: var(--step--1); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.diff-file { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.diff-file > .file-head, .file-toggle .file-head {
  text-transform: none; letter-spacing: 0; color: var(--ink);
}
.file-head {
  margin: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline;
  font: 600 var(--step--1)/1.4 var(--font-body); overflow-wrap: anywhere;
}
.file-head a { color: var(--ink); text-decoration: none; }
.file-head a:hover { text-decoration: underline; }
.file-head .sub { color: var(--ink-soft); font-weight: 400; }
.file-head .n { margin-left: auto; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.fstatus { border-radius: 4px; padding: 0 6px; font: 700 10.5px/1.7 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; background: var(--wash); color: var(--ink-soft); }
.fstatus.added { background: var(--good-wash); color: var(--good); }
.fstatus.removed { background: var(--bad-wash); color: var(--bad); }
.fstatus.renamed { background: var(--accent-wash); color: var(--accent); }
.file-toggle { display: flex; gap: 6px; align-items: baseline; }
.file-toggle .file-head { flex: 1; }
button.link { border: 0; background: none; padding: 0 2px; color: var(--accent); font: 500 var(--step--1)/1.4 var(--font-body); }
button.link:hover { text-decoration: underline; }
.folded { margin: 0 0 0 20px; font-size: var(--step--1); }

.decls { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.decl { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px 10px; display: grid; gap: 6px; min-width: 0; }
.decl-head { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: var(--step--1); }
.decl-head strong { font-size: 13px; overflow-wrap: anywhere; }
.decl-head .kind { color: var(--ink-soft); }
.decl-head .sub { color: var(--ink-soft); }
.decl-head .line { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.internal { border: 1px solid var(--rule); border-radius: 999px; padding: 0 7px; font-size: 11px; color: var(--ink-soft); }
.badge { border-radius: 4px; padding: 0 6px; font: 700 10.5px/1.7 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; }
.badge.added { background: var(--good-wash); color: var(--good); }
.badge.removed { background: var(--bad-wash); color: var(--bad); }
.badge.changed { background: var(--warn-wash); color: var(--warn); }
.badge.moved { background: var(--accent-wash); color: var(--accent); }
.badge.body { background: var(--wash); color: var(--ink-soft); }
pre.sig {
  margin: 0; padding: 7px 10px; background: var(--wash); border-radius: 6px; overflow-x: auto;
  font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; max-width: 100%;
}
pre.sig.ins-all { background: var(--good-wash); }
pre.sig.del-all { background: var(--bad-wash); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); }
pre.sig ins, .md ins { background: var(--good-wash); color: var(--good); text-decoration: none; border-radius: 2px; }
pre.sig del, .md del { background: var(--bad-wash); color: var(--bad); border-radius: 2px; }
.body-diff { display: grid; gap: 6px; justify-items: start; }
.body-diff .patch-wrap { justify-self: stretch; }
.diff-notes { color: var(--ink-soft); font-size: var(--step--1); border-top: 1px solid var(--rule); padding-top: 10px; }
.diff-notes p { margin: 0 0 4px; overflow-wrap: anywhere; }
.diff-link { font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: 6px; }

.doc-diff { padding: 16px 20px; }
.doc-diff .md { max-width: 80ch; }
.md-ins { border-left: 3px solid var(--good); padding-left: 12px; background: color-mix(in srgb, var(--good-wash) 60%, transparent); }
.md-del { border-left: 3px solid var(--bad); padding-left: 12px; color: var(--ink-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.md td:has(> .md-skip) { padding: 0; }
.md td > .md-skip { margin: 0; border: 0; }
.md-skip {
  margin: 14px 0; padding: 3px 10px; border-block: 1px dashed var(--rule); color: var(--ink-soft);
  font: 500 var(--step--1)/1.5 var(--font-body); text-align: center; background: var(--paper);
}

.patch-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); max-width: 100%; }
.patch-table { border-collapse: collapse; width: 100%; font: 12px/1.5 var(--font-mono); }
.patch-table td { padding: 0 10px; vertical-align: top; }
.patch-table .ln {
  width: 1%; min-width: 3.2em; text-align: right; color: var(--ink-soft); user-select: none;
  font-variant-numeric: tabular-nums; border-right: 1px solid var(--rule); white-space: nowrap;
}
.patch-table .code { white-space: pre; tab-size: 4; }
.patch-table .mark { display: inline-block; width: 1.2em; user-select: none; color: var(--ink-soft); }
.patch-table tr.add { background: var(--good-wash); }
.patch-table tr.del { background: var(--bad-wash); }
.patch-table tr.add .mark { color: var(--good); }
.patch-table tr.del .mark { color: var(--bad); }
.patch-table tr.hunk td, .patch-table tr.note td { background: var(--accent-wash); color: var(--ink-soft); padding-block: 2px; }
@media (max-width: 520px) {
  .toggle, .decl-head .line, .file-head .n { margin-left: 0; }
}

/* ---- Minimal: no boxes or bands; rules, space and quiet text buttons ---- */
:root body { font-family: var(--font-body); }
:root .wrap { gap: 40px; max-width: 920px; }
:root .strip { border-bottom: 0; padding-block: 28px 4px; }
:root .strip h1 { font-family: var(--font-display); font-stretch: 100%; }
:root .stale { border-radius: 3px; }
:root section { gap: 0; }
:root section > h2 { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.08em; padding-bottom: 10px; }
:root .cards { gap: 0; }
:root .card,
:root .card.mine { background: none; border: 0; border-radius: 0; border-top: 1px solid var(--rule); overflow: visible; }
:root .card:last-child { border-bottom: 1px solid var(--rule); }
:root .move { background: none; border: 0; padding: 14px 0 0; font-family: var(--font-body); font-size: var(--step--1); font-weight: 600; font-stretch: 100%; }
:root .body { padding: 14px 0 16px; gap: 6px; }
:root .card.mine .body { padding-top: 4px; }
:root .head h3 { font-family: var(--font-body); }
:root .refs, :root .refs a { font-family: var(--font-mono); font-size: 12px; }
:root .refs a { color: var(--ink-soft); text-decoration: none; }
:root .refs a:hover { color: var(--accent); text-decoration: underline; }
:root .controls { gap: 2px 14px; padding-top: 2px; }
:root .controls button,
:root .controls .btn { background: none; border: 0; border-radius: 0; padding: 2px 0; color: var(--ink-soft); font-family: var(--font-body); font-weight: 500; }
:root .controls button:hover,
:root .controls .btn:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
:root .controls button[aria-pressed="true"] { color: var(--accent); background: none; }
:root .controls .btn.merge,
:root .controls .btn.merge.big { color: var(--merge); font-weight: 650; padding: 2px 0; background: none; }
:root .controls .btn.merge.big { background: var(--merge); color: var(--on-solid); padding: 3px 12px; border-radius: 4px; }
:root .controls .btn.merge.big:hover { text-decoration: none; filter: brightness(1.08); }
:root form.act { background: none; border: 0; border-left: 2px solid var(--rule); border-radius: 0; padding: 4px 0 4px 14px; }
:root .confirm { border: 0; border-radius: 4px; }
:root .details { gap: 0; }
:root .panel { background: none; border: 0; border-left: 2px solid var(--rule); border-radius: 0; padding: 4px 0 4px 18px; margin-top: 8px; gap: 6px; }
:root .panel h5 { font-family: var(--font-mono); font-weight: 500; margin-top: 14px; }
:root .state, :root .label { font-family: var(--font-mono); font-size: 11px; }
:root .label { border: 0; background: var(--wash); }
:root .list { gap: 1px; }
:root .panel > ul.list:not(.files) { display: flex; flex-wrap: wrap; gap: 2px 18px; }
:root details.adr { border: 0; border-radius: 0; padding: 4px 0; background: none; }
:root .comment { border-top: 0; padding-top: 10px; }
:root .slots { margin: 0; }
:root .slots strong { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; }
:root .slots ul { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 8px; }
:root .slots li { padding: 0; }
:root .notice { border-style: solid; border-width: 0 0 0 2px; border-radius: 0; }
:root .links { font-family: var(--font-mono); font-size: 12px; }
/* diff viewer */
:root .diff-head h1 { font-family: var(--font-display); font-stretch: 100%; }
:root .tabs { gap: 22px; }
:root .tabs button { padding-inline: 0; font-family: var(--font-body); }
:root .tabs .count { background: none; font-family: var(--font-mono); padding: 0; }
:root .decls { gap: 0; }
:root .decl { background: none; border: 0; border-radius: 0; padding: 10px 0; }
:root .diff-file + .diff-file { border-top: 1px solid var(--rule); padding-top: 18px; }
:root .badge, :root .fstatus { background: none !important; padding: 0; font-family: var(--font-mono); font-weight: 500; }
:root .internal { border: 0; padding: 0; font-family: var(--font-mono); }
:root pre.sig { border-radius: 4px; }
:root .patch-wrap { border-radius: 4px; }
:root .sheet { background: none; border: 0; padding: 0; }
:root .doc-diff { padding: 0; }
:root .diff-file { gap: 10px; padding-top: 8px; }
:root .file-head { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; }

/* ---- Signal's type ---- */
:root .strip h1 { font-weight: 700; font-size: 1.9rem; font-variation-settings: "opsz" 96, "wdth" 80; letter-spacing: -0.02em; }
:root .move { color: var(--move); font-family: var(--font-mono); font-weight: 400; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; }
:root .head h3 { font-size: 1.2rem; font-weight: 600; font-variation-settings: "opsz" 32; }
:root section > h2 { font-size: 11px; color: var(--ink-soft); }
:root .refs, :root .refs a, :root .slots code { font-size: 11px; font-weight: 300; }
:root .strip .need strong { color: var(--move); font-family: var(--font-mono); }

/* ---- The board: Inbox ---- */
.layout { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); padding-bottom: 110px; }
.layout h2 { margin: 0 0 8px; font: 500 11px/1.4 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.layout section { display: block; }
.layout .move { color: var(--move); font: 400 11.5px/1.5 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; }
.layout .move.big { font-size: 13px; }
.layout .empty.big { font: 500 var(--step-1) var(--font-body); color: var(--ink-soft); }
.layout .refs { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 11.5px var(--font-mono); }
.layout .refs a { color: var(--ink-soft); text-decoration: none; }
.layout .refs a:hover { color: var(--accent); text-decoration: underline; }
.layout .refs .box { color: var(--ink-soft); opacity: 0.7; }
.layout .doing { color: var(--ink); }
.layout .doing .why { color: var(--ink-soft); }
.layout .row-body { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); padding: 4px 0 18px; }
.layout .controls { gap: 2px 14px; }
.layout .controls button, .layout .controls .btn { background: none; border: 0; padding: 2px 0; color: var(--ink-soft); font: 500 var(--step--1) var(--font-body); }
.layout .controls button:hover, .layout .controls .btn:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.layout .controls .btn.merge.big { background: var(--merge); color: var(--on-solid); padding: 3px 12px; border-radius: 4px; text-decoration: none; }
.layout .panel { background: none; border: 0; border-left: 2px solid var(--rule); border-radius: 0; padding: 4px 0 4px 18px; }
.layout .panel > ul.list:not(.files) { display: flex; flex-wrap: wrap; gap: 2px 18px; }
.layout button.quiet-toggle, .layout .recent-line > button {
  background: none; border: 0; padding: 4px 0; color: var(--ink-soft); font: 500 12px var(--font-mono); letter-spacing: 0.04em; cursor: pointer;
}
.layout button.quiet-toggle:hover { color: var(--ink); }
.layout .recent-line .recorded { margin-top: 8px; }
.glyph { display: inline-block; width: 1.2em; text-align: center; font-family: var(--font-mono); color: var(--ink-soft); }
.glyph.yours { color: var(--move); }
.glyph.working { color: var(--accent); }
.glyph.review { color: var(--good); }
.glyph.blocked { color: var(--bad); }

/* the header line every layout shares */
.topline { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline; padding-top: 28px; }
.topline h1 { margin: 0; font: 700 1.6rem/1.1 var(--font-display); font-variation-settings: "opsz" 96, "wdth" 80; letter-spacing: -0.02em; }
.topline .tl-meta, .topline .tl-slots { color: var(--ink-soft); font: 400 11.5px var(--font-mono); }
.topline .tl-slots { cursor: help; border-bottom: 1px dotted var(--rule); }
.topline .legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-soft); font: 400 11px var(--font-mono); }
.topline .filter {
  margin-left: auto; width: 16rem; max-width: 100%; background: var(--wash); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 4px; padding: 5px 9px; font: 400 12px var(--font-mono);
}

/* 1. inbox */
.inbox { display: grid; grid-template-columns: minmax(14rem, 22rem) minmax(0, 1fr); gap: 32px; align-items: start; }
:root .wrap:has(.layout-inbox) { max-width: 1240px; }
.inbox-list { position: sticky; top: 12px; max-height: calc(100vh - 140px); overflow: auto; padding-right: 8px; }
.inbox-list ul { list-style: none; margin: 0 0 22px; padding: 0; }
.inbox-item .title { flex: 1; text-align: left; }
.inbox-item { display: flex; justify-content: flex-start; align-items: baseline; gap: 6px; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 8px; color: var(--ink-soft); font: 500 var(--step--1)/1.4 var(--font-body); cursor: pointer; }
.inbox-item:hover { color: var(--ink); background: var(--wash); }
.inbox-item.selected { color: var(--ink); background: var(--wash); }
.inbox-pane { display: grid; gap: 10px; align-content: start; border-left: 1px solid var(--rule); padding-left: 32px; min-width: 0; }
.pane-title { margin: 0; font: 600 1.45rem/1.25 var(--font-display) !important; text-transform: none !important; letter-spacing: -0.01em !important; color: var(--ink) !important; text-wrap: balance; }
@media (max-width: 760px) {
  .inbox { grid-template-columns: minmax(0, 1fr); }
  .inbox-list { position: static; max-height: none; }
  .inbox-pane { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 18px; }
}


/* ---- Chat with the manager (the first entry in the inbox) ---- */
.chat-item .title { display: grid; gap: 2px; min-width: 0; color: var(--ink); }
.chat-item .preview { color: var(--ink-soft); font-weight: 400; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox-list > ul:first-child { margin-bottom: 18px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.layout .chat { display: grid; gap: 12px; grid-template-rows: minmax(0, 1fr) auto; min-height: min(70vh, 40rem); }
.chat-thread { display: grid; gap: 16px; align-content: start; overflow-y: auto; max-height: calc(100vh - 260px); padding-right: 6px; }
.msg { display: grid; gap: 3px; max-width: 62ch; }
.msg .who { font: 400 11px var(--font-mono); color: var(--ink-soft); letter-spacing: 0.03em; }
.msg.manager .who { color: var(--move); }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.msg.owner { justify-self: end; text-align: left; }
.msg.owner .text { background: var(--wash); border-radius: 8px; padding: 8px 12px; }
.msg.owner .who { justify-self: end; }
.msg.sending .text { opacity: 0.65; }
.chat-waiting { margin: 0; color: var(--ink-soft); font: 400 11.5px var(--font-mono); }
.composer { display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid var(--rule); padding-top: 12px; }
.composer textarea {
  flex: 1; min-width: 0; resize: vertical; min-height: 2.8rem; max-height: 14rem; background: var(--wash); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 9px 11px; font: 400 var(--step-0)/1.45 var(--font-body);
}
.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.composer .send { background: var(--ink); color: var(--paper); border: 0; border-radius: 6px; padding: 9px 16px; font: 600 var(--step--1) var(--font-body); }
.composer .send:hover { filter: brightness(0.92); border: 0; }
.notice.warn { border-left-color: var(--warn); color: var(--ink); }
.notice.warn strong { color: var(--warn); }
.inbox-item .title { display: grid; gap: 2px; min-width: 0; }
.inbox-item .need { color: var(--move); font: 400 10.5px/1.45 var(--font-mono); letter-spacing: 0.02em; text-transform: uppercase; opacity: 0.85; }
.inbox-item.selected .need { opacity: 1; }
.inbox-item.resolved .title { color: var(--ink-soft); }
.inbox-item.resolved .need { color: var(--ink-soft); text-decoration: line-through; opacity: 0.7; }
.inbox-item .reopened { color: var(--bad); font: 400 11px/1.45 var(--font-body); }
.glyph.done { color: var(--good); }
.layout .move.resolved { color: var(--good); }
.reopened-note { margin: 0; color: var(--bad); font-size: var(--step--1); }
.layout .controls button.resolve {
  color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 10px; font-weight: 600;
}
.layout .controls button.resolve:hover, .layout .controls button.resolve[aria-expanded="true"] { border-color: var(--good); color: var(--good); text-decoration: none; }
.resolve-confirm { background: var(--wash) !important; border: 1px solid var(--rule) !important; }
.resolve-confirm > span { flex-basis: 100%; }
.resolve-confirm input { flex: 1 1 16rem; min-width: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; font: inherit; }
.resolve-confirm button.primary { background: var(--good); border-color: var(--good); color: #0b1a12; }

/* ---- Contract and Implementation: just the code; the text is colored by change ---- */
:root .decls { display: block; margin-top: 6px; }
:root .decl { display: block; padding: 0; margin: 0; border: 0; background: none; }
:root .decl pre.sig, :root .decl pre.code-diff {
  background: none; padding: 0; margin: 0; border-radius: 0; font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; tab-size: 4; color: var(--ink);
}
:root .decl pre.sig.ins-all, :root .decl pre.sig ins, .code-diff .add { color: var(--good); background: none; text-decoration: none; }
:root .decl pre.sig.del-all, :root .decl pre.sig del, .code-diff .del { color: var(--bad); background: none; text-decoration: none; }
.code-diff .ctx { color: var(--ink-soft); }
.code-diff .gap { color: var(--ink-soft); opacity: 0.6; }
:root .decl pre.code-diff { padding-left: 2ch; }

/* ---- Syntax shades: the change's color first, the kind of code second ---- */
/* unchanged code: greys, the names that matter a little brighter */
.decl .tk-kw { color: #c9c6bf; }
.decl .tk-type { color: #a7b3c2; }
.decl .tk-fn { color: #e9e7e2; font-weight: 600; }
.decl .tk-str { color: #b8ad92; }
.decl .tk-num { color: #b8ad92; }
.decl .tk-com { color: #5c5e65; font-style: italic; }
.code-diff .ctx { color: #8a8b91; }
.code-diff .ctx .tk-kw { color: #a8a6a0; }
.code-diff .ctx .tk-fn { color: #bdbab3; font-weight: 400; }
/* added: shades of green */
:root .decl .ins-all, :root .decl ins, .code-diff .add { color: #6fd39b; }
.decl .ins-all .tk-kw, .decl ins .tk-kw, .code-diff .add .tk-kw { color: #b9f2cf; }
.decl .ins-all .tk-type, .decl ins .tk-type, .code-diff .add .tk-type { color: #49c9a6; }
.decl .ins-all .tk-fn, .decl ins .tk-fn, .code-diff .add .tk-fn { color: #9ff5bd; font-weight: 600; }
.decl .ins-all .tk-str, .decl ins .tk-str, .code-diff .add .tk-str { color: #c3db78; }
.decl .ins-all .tk-num, .decl ins .tk-num, .code-diff .add .tk-num { color: #c3db78; }
.decl .ins-all .tk-com, .decl ins .tk-com, .code-diff .add .tk-com { color: #3f7a57; font-style: italic; }
/* removed: shades of red */
:root .decl .del-all, :root .decl del, .code-diff .del { color: #ff7a7a; }
.decl .del-all .tk-kw, .decl del .tk-kw, .code-diff .del .tk-kw { color: #ffc0bd; }
.decl .del-all .tk-type, .decl del .tk-type, .code-diff .del .tk-type { color: #f58fb0; }
.decl .del-all .tk-fn, .decl del .tk-fn, .code-diff .del .tk-fn { color: #ffa3a3; font-weight: 600; }
.decl .del-all .tk-str, .decl del .tk-str, .code-diff .del .tk-str { color: #ffaa72; }
.decl .del-all .tk-num, .decl del .tk-num, .code-diff .del .tk-num { color: #ffaa72; }
.decl .del-all .tk-com, .decl del .tk-com, .code-diff .del .tk-com { color: #8a4a4a; font-style: italic; }
.decl:has(.code-diff) { margin-bottom: 14px; }
.decl.group-start { margin-top: 1.6em; }
</style>
