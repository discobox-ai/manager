# The manager's configuration. The only per-deployment settings; everything
# else is in AGENTS.md and the skills.

owner: darren@obot.ai

# Repositories the manager watches and works in. `defaultBranch` is what
# workers branch from and PRs target (the box's `base` tag), even when it
# isn't GitHub's default branch.
repos:
  - name: discobox-ai/discobox
    defaultBranch: main
  - name: discobox-ai/vm
    defaultBranch: main
  - name: discobox-ai/manager
    defaultBranch: main
  - name: discobox-ai/release-validation
    defaultBranch: main
  # Added by the owner 2026-11-01. defaultBranch assumed; check when gh is authenticated.
  - name: discobox-ai/review
    defaultBranch: main
    # Was codex for all its work (owner, 2026-11-11); back to claude-code with
    # everything else (owner, 2026-11-13: "lets switch the harness to claude").
    harness: claude-code
  # Added by the owner 2026-11-04: the docs site, blog and home page.
  # defaultBranch main checked 2026-11-04.
  - name: discobox-ai/site
    # PRs go to preview; the owner merges preview into main (owner, 2026-11-04),
    # and nothing reaches main until a release (0.19, 0.20) ships (2026-11-05).
    # A PR into preview doesn't close its issue: the manager closes it on merge.
    defaultBranch: preview
  # Added by the owner 2026-11-04: #602 is blocked on a fix here.
  # defaultBranch assumed; check once the bot can read it.
  - name: discobox-ai/hooks
    defaultBranch: main
  # Added by the owner 2026-11-05: the hello-world tour (discobox#633). Public.
  - name: discobox-ai/tour
    defaultBranch: main
  # Added by the owner 2026-11-13: the repository standard (go tool repocheck
  # sync) whose templates vm, hooks and others are synced from (vm#104). The
  # bot has Triage. defaultBranch assumed; check once the bot can read it.
  - name: discobox-ai/repostd
    defaultBranch: main
  # Added by the owner 2026-11-14: discobox's Go binding to Apple's
  # Virtualization.framework (#1114's handle crash). defaultBranch assumed;
  # check once the bot can read it.
  - name: discobox-ai/vz
    defaultBranch: main

# The release being worked toward (owner, 2026-11-04). Its milestone's issues
# come next after blockers (docs/labels.md, Next up). The owner creates the
# milestone; the manager applies it.
release:
  repo: discobox-ai/discobox
  milestone: v0.19 Release
  # Its parts in other repositories, which a discobox milestone can't hold.
  # Not same-named milestones elsewhere: from v0.20 a release is a GitHub
  # Project across repositories (owner, 2026-11-05; discobox#693).
  alsoIn:
    - discobox-ai/manager#2
    - discobox-ai/manager#4
    - discobox-ai/site#2
    - discobox-ai/site#3
    - discobox-ai/site#4
  # The release after it (owner created it 2026-11-04): what's decided, but later.
  next: v0.20 Release

# Focus (owner, 2026-11-12: "I want to complete those two streams, prioritize
# that work and keep me focused on it"). The streams the owner is driving now,
# in order. Their rows rank above everything else on the table (group 0, ahead
# of blockers), and within a stream the owner's moves come first. Their workers
# take free slots first. A row is in a stream when its issue or PR is listed
# here, or when it carries `stream=<name>` (`scripts/table set KEY
# stream=boxd`). Every issue filed for a stream is added here or tagged so.
# Only the owner adds or removes a stream.
focus:
  - stream: boxd
    items:
      - discobox-ai/discobox#947
      - discobox-ai/discobox#1012
      - discobox-ai/discobox#1006
      - discobox-ai/discobox#997
      - discobox-ai/discobox#456
      - discobox-ai/discobox#455
      - discobox-ai/vm#84
      - discobox-ai/discobox#1090
      # #1090's follow-ups (owner, 2026-11-13: "Lets go ahead with this
      # approach for boxd"): in-machine auth for a boxd pool.
      - discobox-ai/discobox#1092
      - discobox-ai/vm#109
  - stream: macOS
    items:
      - discobox-ai/discobox#42
      - discobox-ai/discobox#59
      - discobox-ai/discobox#63
      - discobox-ai/vm#75
      - discobox-ai/discobox#696
      # The owner's attached-drive direction (2026-11-13), replacing vm#83.
      - discobox-ai/vm#110

workers:
  # The harness every new worker box runs (`discobox run -H`; owner, 2026-11-04;
  # switched from codex back to claude-code by the owner, 2026-11-07).
  # Boxes already running keep theirs.
  harness: claude-code
  # Bug fixes run this harness instead: deliver-issue on an issue labelled
  # type/bug or type/flake, and fix-ci. Was codex (owner, 2026-11-10); every
  # worker runs claude-code again (owner, 2026-11-13: "lets switch the harness
  # to claude").
  bugHarness: claude-code
  # Intake pause (owner): true starts no new triage or delivery boxes but
  # those in pausedExcept; work in progress carries on. Resumed 2026-11-03.
  paused: false
  pausedExcept: []
  # Factory stop (owner, 2026-11-10; `stop` and `resume` skills): true means
  # every agent is idle on purpose: the loop isn't running, the manager's
  # boxes are stopped, and nothing starts. Only /resume clears it.
  stopped: false
  # Workers running at once, triage and delivery together: a box counts only
  # while its power state is running or starting. Suspended (paused), stopped,
  # asleep and archived boxes don't count (owner, 2026-11-05). The owner set ten for this host (2026-11-05); lower it when
  # disk is tight.
  max: 10
  # A worker waiting on the owner (needs-input or blocked) whose screen has
  # been still this long is stopped; the owner opening it starts it again.
  pauseAfter: 5m
  # Of those, triage workers up at once, so a backlog of new issues doesn't
  # take every slot. New issues are triaged highest priority/* first, then
  # newest first.
  triageMax: 2
  # Where workers get their skills.
  skills: discobox-ai/manager//worker-skills

# Auto-merge (owner, 2026-11-14): the merge-gate box rebase-merges, with the
# owner's own credential, PRs that pass worker-skills/merge-gate. Only PRs
# authored by ibuildthecloud-bot from its fork ("VERY IMPORTANT"), only into
# these repositories' default branch, never an ADR, a sensitive path, a new
# dependency, or anything over the limits; two fresh reviews (security,
# complexity) must pass. Every auto-merge is labelled `auto-merged` for the
# owner's audit. No dry run, no pause for release validation (owner). false
# stops it at once; a `no-automerge` label on a PR or its issue opts one out.
autoMerge:
  enabled: true
  author: ibuildthecloud-bot
  repos:
    - discobox-ai/discobox
    - discobox-ai/vm
  method: rebase
  maxLines: 400
  maxFiles: 15
  label: auto-merged

# Feature tracks (owner, 2026-11-07): long-running work on its own integration
# branch. Every issue in a track's epic (its checklist) branches from and
# targets `branch`, never the default branch. merge: manager means the manager
# merges green, reviewed and verified PRs into that branch itself (a
# fast-forward of the branch ref, `workers` § Feature tracks); the owner merges
# only the branch into main, once. Track work runs alongside the release, after
# its milestone's work, and is suspended while release validation measures.
tracks:
  - name: desktop-console
    repo: discobox-ai/discobox
    branch: feature/desktop-console
    epic: 786
    merge: manager
    # The manager answers its workers' questions with the worker's recommended
    # option (owner, 2026-11-10: "always go with the agents recommended
    # solution, we want this to run without intervention").
    decide: recommended

# Provider credentials the owner delegated for real-API work (owner,
# 2026-11-10: "i can give creds ... just request for the API domains"). Bind
# one only to a box whose job needs the real provider (the remote-drivers
# track, discobox#947), always narrowed to its hosts with
# `scripts/launch --bind`. The secret's name is what the owner chose on
# approval; check `discobox-access list -json` if a bind fails.
providers:
  boxd:
    bind: "boxd-test4:BOXD_API_KEY@boxd.sh,*.boxd.sh"
    expires: 2026-12-10
  archil:
    bind: "archil-2:ARCHIL_API_KEY@*.archil.com"

# The owner's platform agents (owner, 2026-11-10, 2026-11-11): the only places
# macOS/vz and Windows/hcs work can run. One agent each, so each one's jobs
# are serialized; only manager-loop sends them (`workers` § Platform workers).
platformWorkers:
  - agent: macos-worker
    platform: darwin
  - agent: win-worker
    platform: windows
    # Its project root is the latest discobox-ai/vm main.
    repo: discobox-ai/vm

disk:
  # Below this, stop starting workers and have idle ones free build caches.
  minFreeGiB: 60

# GitHub: the bot account the manager and its workers act as (owner,
# 2026-11-03). It has Triage on the product repositories and Write on this one;
# workers push to its forks and open PRs from them.
github:
  forkOwner: ibuildthecloud-bot

# GitHub access: the manager asks for its own and its workers' in one request,
# roles/manager-request.json (roles/README.md).
